name: Build Club App APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install image tools
        run: pip install pillow

      - name: Prepare web app
        run: |
          test -f index.html
          test -f file_00000000348881f4b8ec1619f98a315c.png
          mkdir -p csc-build/www
          cp index.html csc-build/www/index.html
          cd csc-build
          npm init -y
          npm install @capacitor/core @capacitor/android
          npm install --save-dev @capacitor/cli
          npx cap init "Club App" com.csc.taekwondo --web-dir www
          npx cap add android
          npx cap sync android

      - name: Set app name and icon
        run: |
          python - <<'PY'
          from PIL import Image
          from pathlib import Path
          import xml.etree.ElementTree as ET

          root = Path("csc-build/android/app/src/main/res")
          source = Image.open(
              "file_00000000348881f4b8ec1619f98a315c.png"
          ).convert("RGBA")

          pixels = source.load()
          for y in range(source.height):
              for x in range(source.width):
                  r, g, b, a = pixels[x, y]
                  if r > 245 and g > 245 and b > 245:
                      pixels[x, y] = (255, 255, 255, 0)

          sizes = {
              "mdpi": 48,
              "hdpi": 72,
              "xhdpi": 96,
              "xxhdpi": 144,
              "xxxhdpi": 192,
          }

          for density, size in sizes.items():
              folder = root / f"mipmap-{density}"
              folder.mkdir(parents=True, exist_ok=True)
              icon = source.resize(
                  (size, size), Image.Resampling.LANCZOS
              )
              icon.save(folder / "ic_launcher.png")
              icon.save(folder / "ic_launcher_round.png")

          adaptive = root / "mipmap-anydpi-v26"
          if adaptive.exists():
              for name in ("ic_launcher.xml", "ic_launcher_round.xml"):
                  file = adaptive / name
                  if file.exists():
                      file.unlink()

          strings = Path(
              "csc-build/android/app/src/main/res/values/strings.xml"
          )
          tree = ET.parse(strings)
          xmlroot = tree.getroot()
          app_name = xmlroot.find("./string[@name='app_name']")
          if app_name is None:
              app_name = ET.SubElement(xmlroot, "string", name="app_name")
          app_name.text = "Club App"
          tree.write(strings, encoding="utf-8", xml_declaration=True)
          PY

      - name: Build Android APK
        run: |
          cd csc-build/android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Club-App-APK
          path: csc-build/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
