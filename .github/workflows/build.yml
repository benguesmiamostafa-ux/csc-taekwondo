
name: Build Club App APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Check project files
        run: |
          test -f index.html || {
            echo "ERROR: index.html is missing"
            exit 1
          }

      - name: Prepare web app
        run: |
          mkdir -p csc-build/www
          cp index.html csc-build/www/index.html
          cd csc-build
          npm init -y
          npm install @capacitor/core @capacitor/android
          npm install --save-dev @capacitor/cli
          npx cap init "Club App" com.clubapp.sports --web-dir www

      - name: Build Android project
        run: |
          cd csc-build
          npx cap add android
          npx cap sync android

      - name: Create generic sports icon
        run: |
          mkdir -p csc-build/android/app/src/main/res/drawable
          mkdir -p csc-build/android/app/src/main/res/mipmap-hdpi
          mkdir -p csc-build/android/app/src/main/res/mipmap-mdpi
          mkdir -p csc-build/android/app/src/main/res/mipmap-xhdpi
          mkdir -p csc-build/android/app/src/main/res/mipmap-xxhdpi
          mkdir -p csc-build/android/app/src/main/res/mipmap-xxxhdpi
          cat > csc-build/android/app/src/main/res/drawable/club_icon.xml <<'EOF'
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp"
              android:height="108dp"
              android:viewportWidth="108"
              android:viewportHeight="108">
              <path android:fillColor="#101827"
                  android:pathData="M0,0h108v108h-108z"/>
              <path android:fillColor="#F5BD42"
                  android:pathData="M54,15 L78,24 L76,53 Q72,73 54,87 Q36,73 32,53 L30,24 Z"/>
              <path android:fillColor="#173D72"
                  android:pathData="M54,22 L71,28 L69,51 Q66,66 54,76 Q42,66 39,51 L37,28 Z"/>
              <path android:fillColor="#F5BD42"
                  android:pathData="M53,31 L58,43 L71,44 L61,52 L64,65 L53,58 L42,65 L45,52 L35,44 L48,43 Z"/>
          </vector>
          EOF

      - name: Configure app label and icon
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("csc-build/android/app/src/main/AndroidManifest.xml")
          s = p.read_text()
          s = s.replace('android:label="@string/app_name"', 'android:label="Club App"')
          if 'android:label=' not in s.split('<application', 1)[1].split('>', 1)[0]:
              s = s.replace('<application', '<application android:label="Club App"', 1)
          s = s.replace('android:icon="@mipmap/ic_launcher"', 'android:icon="@drawable/club_icon"')
          p.write_text(s)
          PY

      - name: Build Android APK
        run: |
          cd csc-build/android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Club-App-APK
          path: csc-build/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
